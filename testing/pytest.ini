[pytest]
testpaths = unit integration api regression generated/approved
python_files = test_*.py
timeout = 30
# Live tests (@pytest.mark.live) hit the real Yahoo Finance endpoint over
# the network and are excluded from the default run so they can't make a
# plain `pytest` invocation flaky against a third-party rate limit -- run
# them explicitly with `pytest -m live` (this addopts value is overridden,
# not appended to, by an explicit -m on the command line).
addopts = -m "not live"
markers =
    security: probes injection/auth-bypass style inputs
    ai_generated: written by the AI test-case generator (review gate applies)
    live: makes a real network call to the live deployment; excluded from the default run, see `pytest -m live`
