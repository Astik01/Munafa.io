name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  python-api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Start local dev server (serves the /api/yahoo proxy under test)
        # Runs the suite against `vite dev` rather than the live Vercel
        # deployment: the deployment's edge network rate-limits /api/yahoo/*
        # under bursty load (see testing/README.md's known_issues), so
        # hammering production from CI on every push would be both a bad
        # citizen and a source of pure infra flakiness unrelated to the code.
        run: |
          nohup npm run dev > vite-dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5173/ > /dev/null || (cat vite-dev.log && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: testing/requirements.txt

      - name: Install Python test dependencies
        run: pip install -r testing/requirements.txt

      - name: Unit tests (offline, no network -- must pass)
        working-directory: testing
        run: python -m pytest unit -v

      - name: Integration / API / AI-generated tests (live proxy -- informational)
        # Non-blocking: these exercise a real third-party dependency
        # (Yahoo Finance) through our own proxy, so a transient failure here
        # reflects that dependency's flakiness, not necessarily a code
        # regression. Unit tests above are what actually gates the build.
        working-directory: testing
        continue-on-error: true
        env:
          MUNAFA_BASE_URL: http://localhost:5173
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest integration api generated/approved -v --ai-analyze

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            testing/reports/latest.json
            testing/reports/latest.html
          if-no-files-found: ignore
